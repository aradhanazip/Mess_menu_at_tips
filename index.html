*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:14px}

function refresh(){var n=new Date();if(n.getDate()!==lastDay){location.reload();return}now=n;h=n.getHours()+n.getMinutes()/60;render()}
